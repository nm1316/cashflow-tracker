<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Cashflow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Personal cashflow and expense tracker - works offline!" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=28" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=28" />
    <title>My Cashflow</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var key = 'av';
        var ver = '28';
        localStorage.setItem(key, ver);
        localStorage.setItem('preferred_month', 'May');
        localStorage.removeItem('cashflow_cache');

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) { names.forEach(function(n) { caches.delete(n); }); });
        }

        /* RECOVERY: push localStorage data to cloud immediately */
        (function() {
          var raw;
          try { raw = localStorage.getItem('cashflow_data'); } catch(e) {}
          if (!raw) return;
          var data;
          try { data = JSON.parse(raw); } catch(e) { return; }
          if (!Array.isArray(data) || data.length === 0) return;
          var body = JSON.stringify(data);
          function attempt(n) {
            fetch('/api/data', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: body
            }).then(function(r) {
              if (r.ok) {
                /* verify */
                fetch('/api/data').then(function(v) { return v.json(); }).then(function(vd) {
                  if (typeof localStorage !== 'undefined') {
                    try { localStorage.setItem('recovery_ok', 'Pushed ' + data.length + ' records, cloud has ' + vd.length); } catch(e) {}
                  }
                });
              } else if (n > 0) { setTimeout(function() { attempt(n - 1); }, 1000); }
            }).catch(function() {
              if (n > 0) { setTimeout(function() { attempt(n - 1); }, 1000); }
            });
          }
          attempt(3);
        })();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
